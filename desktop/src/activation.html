<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activacion - AFP Lookup</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fb;
        color: #18202f;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(420px, calc(100vw - 40px));
        padding: 28px;
        border: 1px solid #d9dee9;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(24, 32, 47, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0 0 22px;
        color: #586175;
        line-height: 1.45;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 650;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        height: 42px;
        border: 1px solid #c8cfdd;
        border-radius: 6px;
        padding: 0 12px;
        font: inherit;
      }

      button {
        width: 100%;
        height: 42px;
        margin-top: 14px;
        border: 0;
        border-radius: 6px;
        background: #3d63dd;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      #message {
        min-height: 20px;
        margin-top: 14px;
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Activar AFP Lookup</h1>
      <p>Ingresa la licencia interna asignada por la empresa para habilitar este equipo.</p>
      <form id="form">
        <label for="token">Licencia</label>
        <input id="token" name="token" type="password" autocomplete="off" autofocus>
        <button id="submit" type="submit">Activar</button>
        <div id="message" role="status"></div>
      </form>
    </main>
    <script>
      const form = document.querySelector("#form");
      const token = document.querySelector("#token");
      const submit = document.querySelector("#submit");
      const message = document.querySelector("#message");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        message.textContent = "Validando...";

        const result = await window.licenseApi.activate(token.value);
        if (!result.ok) {
          message.textContent = result.message || "No se pudo activar la licencia.";
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
